version: 2
updates:
  - package-ecosystem: "npm"
    directory: "/"
    schedule:
      interval: "weekly"
    open-pull-requests-limit: 10
    ignore:
      # Angular 22 pins typescript to ">=6.0 <6.1", so a major bump makes
      # `npm ci` fail on peer resolution. Revisit when Angular supports 7.x.
      - dependency-name: "typescript"
        update-types: ["version-update:semver-major"]
      # zone.js's jasmine-patch breaks under jasmine-core 7 ("Cannot assign to
      # read only property 'describe'"). Revisit when zone.js supports 7.x.
      # See: https://github.com/robertncl/hrms/issues/73
      - dependency-name: "jasmine-core"
        update-types: ["version-update:semver-major"]
    groups:
      angular:
        patterns:
          - "@angular/*"
      dev-dependencies:
        dependency-type: "development"
        # Without this, @angular/compiler-cli is pulled out of the angular group
        # above and bumped in a separate PR (see #85), which recreates the exact
        # peer-dependency skew the angular group exists to prevent.
        exclude-patterns:
          - "@angular/*"

  - package-ecosystem: "github-actions"
    directory: "/"
    schedule:
      interval: "weekly"
    groups:
      # codeql-action/init writes a config file stamped with its own version and
      # codeql-action/analyze refuses to read a config from a different version
      # ("Loaded a configuration file for version X, but running version Y").
      # init, analyze and upload-sarif must always bump together.
      codeql-action:
        patterns:
          - "github/codeql-action*"
      github-actions:
        patterns:
          - "*"
